[package]
name = "av-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "av-scan"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "std"], default-features = false }
# yara-x = { version = "0.6", default-features = false }

[profile.release]
lto = true
strip = true
opt-level = "z"